services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    volumes:
      - ./analysis_bc/models:/app/analysis_bc/models
    depends_on:
      redis-python:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  redis-python:
    image: redis:7-alpine
    container_name: redis-python
    ports:
      - "6380:6379"
    volumes:
      - redis-python-data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-news
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis-python-data:
  qdrant-data: