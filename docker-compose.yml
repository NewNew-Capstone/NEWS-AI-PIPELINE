version: '3.8'

services:
  python-analysis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python-analysis
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis-python
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MODEL_PATH=analysis_bc/models/best_model
    depends_on:
      redis-python:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - python-network
    restart: unless-stopped

  redis-python:
    image: redis:7-alpine
    container_name: redis-python
    ports:
      - "6380:6379"
    volumes:
      - redis-python-data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - python-network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-news
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - python-network
    restart: unless-stopped

volumes:
  redis-python-data:
  qdrant-data:

networks:
  python-network:
    driver: bridge